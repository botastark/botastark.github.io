<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
{% seo title=false %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/blog/feed.xml' | relative_url }}">
<link rel="icon" href="{{ '/icons/favicon.svg?v=2' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var theme = localStorage.getItem('theme');
      document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
  }());
</script>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% for stylesheet in page.extra_css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: stylesheet | append: '.css' | relative_url }}">
{% endfor %}
<!-- TODO(Bota): Decide whether to retain Google Analytics with a GDPR-compliant cookie banner (Q6). -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QZSG8DSLW7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QZSG8DSLW7');
</script>
<script src="https://unpkg.com/lucide@1.66.0/dist/umd/lucide.min.js" defer></script>
{% if page.math %}
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
