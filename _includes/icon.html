{%- comment -%}
  Field-specific line icons. Usage: {% include icon.html name="drone" size=24 %}
{%- endcomment -%}
{%- assign size = include.size | default: 24 -%}
<svg class="field-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- case include.name -%}
{%- when "events" -%}
  <!-- spike raster: three neurons / pixels firing asynchronously -->
  <path d="M2.5 6h19M2.5 12h19M2.5 18h19" opacity=".35"/>
  <path d="M5 3.5v5M11.5 3.5v5M15 3.5v5M8 9.5v5M17.5 9.5v5M20 9.5v5M4 15.5v5M10 15.5v5M13 15.5v5"/>
{%- when "drone" -%}
  <!-- quadcopter, top view -->
  <circle cx="5.5" cy="5.5" r="3"/><circle cx="18.5" cy="5.5" r="3"/><circle cx="5.5" cy="18.5" r="3"/><circle cx="18.5" cy="18.5" r="3"/>
  <path d="M7.6 7.6 10 10M16.4 7.6 14 10M7.6 16.4 10 14M16.4 16.4 14 14"/>
  <rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>
{%- when "pointcloud" -%}
  <!-- depth camera and its frustum filled with 3D points -->
  <rect x="1.8" y="9" width="4.6" height="6" rx="1.2"/>
  <path d="M6.4 10.2 21.5 4.5M6.4 13.8l15.1 5.7M21.5 4.5v15" opacity=".5"/>
  <g fill="currentColor" stroke="none"><circle cx="12" cy="11" r="1"/><circle cx="15.5" cy="13.6" r="1"/><circle cx="17.8" cy="9.2" r="1"/><circle cx="13.6" cy="15" r=".8"/><circle cx="19" cy="15.5" r=".8"/><circle cx="16" cy="11.2" r=".7"/></g>
{%- when "arm" -%}
  <!-- articulated robot arm with gripper -->
  <path d="M3 21h9"/><path d="M5.5 21v-2.5a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2V21"/>
  <path d="M8 16.5 9.5 9.5 16.5 6.5"/>
  <circle cx="9.5" cy="9.5" r="1.7"/><circle cx="16.5" cy="6.5" r="1.5"/>
  <path d="M17.8 7.4 20 9.3M20 9.3l1.4-1.5M20 9.3l.2 2"/>
{%- when "document" -%}
  <!-- page with OCR / layout-analysis boxes -->
  <path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5"/>
  <rect x="7.3" y="10.5" width="9.4" height="3.2" rx=".6" stroke-dasharray="1.6 1.4"/>
  <path d="M7.5 16.5h9M7.5 18.8h5.5" opacity=".55"/>
{%- when "chip" -%}
  <!-- neuromorphic chip -->
  <rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 9.5h5v5h-5z" opacity=".5"/>
  <path d="M9 2.5V6M12 2.5V6M15 2.5V6M9 18v3.5M12 18v3.5M15 18v3.5M2.5 9H6M2.5 12H6M2.5 15H6M18 9h3.5M18 12h3.5M18 15h3.5"/>
{%- when "code" -%}
  <path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 4.5l-3 15"/>
{%- endcase -%}
</svg>
