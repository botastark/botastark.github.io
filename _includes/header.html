<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="Bota Duisenbay — Home">
      <svg class="logo-mark" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="40" height="40" rx="12" fill="var(--color-primary)"/>
        <path d="M10 15h8l4 5h10M10 27h8l4-5h10M18 15v12" stroke="var(--color-text-inverse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="15" r="3" fill="#ffb347"/><circle cx="10" cy="27" r="3" fill="#e76f51"/><circle cx="32" cy="20" r="3" fill="#bde3e1"/><circle cx="22" cy="20" r="3.5" fill="#ffb347"/>
      </svg>
      <span class="logo-name">Bota Duisenbay</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.nav == 'home' %} active{% endif %}">Home</a>
      <a href="{{ '/projects.html' | relative_url }}" class="nav-link{% if page.nav == 'projects' %} active{% endif %}">Projects</a>
      {% if site.posts.size > 0 %}<a href="{{ '/blog/' | relative_url }}" class="nav-link{% if page.nav == 'blog' %} active{% endif %}">Blog</a>{% endif %}
      <a href="{{ '/cv.pdf' | relative_url }}" class="nav-link nav-cta" target="_blank" rel="noopener">CV ↗</a>
      <button class="theme-btn" data-theme-toggle aria-label="Switch theme"><i data-lucide="moon" width="18" height="18"></i></button>
    </nav>
  </div>
</header>
